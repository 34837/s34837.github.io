<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Portfolio | Titaya Kaidklaeng</title>

<style>

* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

body {
    font-family: "Tahoma", sans-serif;
    background: linear-gradient(135deg, #d9fff2, #f7fffc);
    color: #30433f;
    min-height: 100vh;
    padding: 35px 20px;
}

/* กล่องหลัก */
.container {
    max-width: 1150px;
    min-height: 680px;
    margin: auto;
    background: #ffffff;
    border-radius: 35px;
    padding: 40px 55px;
    box-shadow: 0 20px 50px rgba(57, 134, 111, 0.15);
    position: relative;
    overflow: hidden;
    border: 2px solid #d8eee7;
}

/* พื้นหลังวงกลม */
.circle {
    position: absolute;
    border-radius: 50%;
    background: #e3f8f0;
    z-index: 0;
}

.circle1 {
    width: 250px;
    height: 250px;
    top: -100px;
    left: -80px;
}

.circle2 {
    width: 300px;
    height: 300px;
    bottom: -150px;
    right: -100px;
}

/* Header */
.header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    position: relative;
    z-index: 2;
}

.logo {
    color: #39866f;
    font-weight: bold;
    font-size: 18px;
}

.welcome {
    color: #648079;
    font-size: 16px;
}

/* ส่วนเนื้อหา */
.hero {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 60px;
    min-height: 510px;
    position: relative;
    z-index: 2;
}

/* ฝั่งข้อความ */
.text {
    flex: 1;
    padding-left: 20px;
}

.small {
    font-size: 25px;
    color: #30433f;
    margin-bottom: 5px;
}

.title {
    font-size: clamp(55px, 7vw, 90px);
    font-weight: 900;
    color: #39866f;
    line-height: 1;
    letter-spacing: 2px;
    margin-bottom: 25px;
}

.line {
    width: 80px;
    height: 5px;
    background: #72bfa8;
    border-radius: 10px;
    margin-bottom: 25px;
}

.description {
    font-size: 18px;
    line-height: 1.9;
    color: #506761;
}

.name {
    font-size: 28px;
    font-weight: bold;
    color: #397c6b;
    margin: 8px 0;
}

.program {
    font-size: 16px;
    color: #71867f;
}

/* ปุ่ม */
.btn {
    display: inline-block;
    margin-top: 25px;
    padding: 14px 30px;
    background: #39866f;
    color: white;
    text-decoration: none;
    border-radius: 50px;
    font-weight: bold;
    transition: 0.3s;
    box-shadow: 0 8px 18px rgba(57,134,111,0.25);
}

.btn:hover {
    transform: translateY(-4px);
    background: #2f725e;
}

/* รูป */
.photo-area {
    width: 390px;
    height: 450px;
    position: relative;
    flex-shrink: 0;
}

.photo-frame {
    width: 330px;
    height: 400px;
    background: #e5f7f0;
    border: 10px solid white;
    border-radius: 45% 45% 25px 25px;
    box-shadow: 0 15px 35px rgba(57,134,111,0.2);
    outline: 3px solid #c7e9dd;
    overflow: hidden;
    position: absolute;
    right: 10px;
    top: 25px;
    transform: rotate(3deg);
}

.photo-frame img {
    width: 100%;
    height: 100%;
    object-fit: cover;
}

/* กระดาษตกแต่ง */
.paper {
    width: 120px;
    height: 75px;
    background: #fffdf0;
    position: absolute;
    left: -5px;
    bottom: 30px;
    transform: rotate(-8deg);
    padding: 15px;
    box-shadow: 0 7px 15px rgba(0,0,0,0.08);
    font-size: 13px;
    color: #63746e;
}

/* ดอกไม้ */
.flower {
    position: absolute;
    font-size: 45px;
}

.flower1 {
    top: 5px;
    left: 5px;
}

.flower2 {
    bottom: 10px;
    right: 0;
}

/* ดาว */
.star {
    position: absolute;
    color: #62ad96;
    font-size: 30px;
}

.star1 {
    top: 100px;
    right: 40px;
}

.star2 {
    bottom: 100px;
    left: 45%;
}

/* Footer */
.footer {
    text-align: center;
    border-top: 1px dashed #b8ddd1;
    padding-top: 20px;
    color: #397c6b;
    font-weight: bold;
    letter-spacing: 3px;
    position: relative;
    z-index: 2;
}

.footer span {
    display: block;
    margin-top: 8px;
    color: #78918a;
    font-size: 13px;
    font-weight: normal;
    letter-spacing: 1px;
}

/* มือถือ */
@media (max-width: 850px) {

    body {
        padding: 15px;
    }

    .container {
        padding: 30px 20px;
    }

    .hero {
        flex-direction: column;
        text-align: center;
        gap: 20px;
        padding-top: 30px;
    }

    .text {
        padding-left: 0;
    }

    .line {
        margin-left: auto;
        margin-right: auto;
    }

    .photo-area {
        width: 300px;
        height: 350px;
    }

    .photo-frame {
        width: 260px;
        height: 320px;
        right: 20px;
    }

    .title {
        font-size: 55px;
    }

    .name {
        font-size: 23px;
    }

    .flower,
    .star {
        display: none;
    }
}

</style>
</head>

<body>

<div class="container">

    <!-- วงกลมพื้นหลัง -->
    <div class="circle circle1"></div>
    <div class="circle circle2"></div>

    <!-- Header -->
    <div class="header">
        <div class="logo">✦ MY PORTFOLIO</div>
        <div class="welcome">Welcome ♡</div>
    </div>


    <!-- เนื้อหาหลัก -->
    <section class="hero">

        <!-- ข้อความ -->
        <div class="text">

            <div class="small">
                ยินดีต้อนรับสู่
            </div>

            <div class="title">
                PORTFOLIO
            </div>

            <div class="line"></div>

            <div class="description">
                สวัสดีค่ะ ดิฉันชื่อ

                <div class="name">
                    นางสาวฑิตยา เกิดเกลี้ยง
                </div>

                <div>
                    Titaya Kaidklaeng
                </div>

                <br>

                <div class="program">
                    🎓 Gifted Program<br>
                    โรงเรียนบ้านบึง “อุตสาหกรรมนุเคราะห์”
                </div>

                <div class="program">
                    สนใจด้านเวชศาสตร์ฟื้นฟูและกายภาพบำบัด<br>
                </div>

                <a href="portfolio.html" class="btn">
                    ไปที่หน้า แฟ้มสะสมผลงาน →
                </a>

            </div>

        </div>


        <!-- รูปโปรไฟล์ -->
        <div class="photo-area">

            <div class="photo-frame">

                
                <img src="IMG_1326.jpeg" alt="Titaya Kaidklaeng">

            </div>

            
                

            <div class="flower flower1">
                🌿
            </div>

            <div class="flower flower2">
                🌷
            </div>

        </div>

    </section>


    <!-- ดาวตกแต่ง -->
    <div class="star star1">✦</div>
    <div class="star star2">✧</div>


    <!-- Footer -->
    <div class="footer">

  

    </div>

</div>

</body>
</html>
