<!DOCTYPE html>
<html lang="th">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Activities | Portfolio</title>

<style>

body {
    font-family: Tahoma, sans-serif;
    background: linear-gradient(135deg, #E6F7FF, #F7FCFF);
    text-align: center;
    padding: 50px 20px;
    color: #344B56;
}

.container {
    max-width: 900px;
    margin: auto;
    background: white;
    padding: 45px;
    border-radius: 30px;
    border: 2px solid #C7E8F5;
    box-shadow: 0 15px 40px rgba(74,155,197,0.15);
}

h1 {
    color: #2878B5;
    margin-bottom: 10px;
}

.line {
    width: 70px;
    height: 5px;
    background: #2878B5;
    border-radius: 10px;
    margin: 15px auto 35px;
}


/* กรอบรูป */

.photo-box {
    width: 300px;
    height: 220px;

    margin: 0 auto 30px;

    border: 3px dashed #8AC6E5;
    border-radius: 20px;

    display: flex;
    align-items: center;
    justify-content: center;

    color: #718B98;
    background: #F7FCFF;
}


/* ปุ่ม */

.btn {
    display: inline-block;
    padding: 13px 28px;

    background: #2878B5;
    color: white;

    text-decoration: none;

    border-radius: 50px;

    font-weight: bold;
}

.btn:hover {
    background: #286681;
}

</style>

</head>


<body>

<div class="container">

    <h1>ACTIVITIES</h1>

    <p>กิจกรรมและประสบการณ์</p>

    <div class="line"></div>


    <!-- กรอบสำหรับใส่รูป -->

    <div class="photo-box">
        📷 ใส่รูปกิจกรรม
    </div>


    <a href="portfolio.html" class="btn">
        ← หน้าที่แล้ว
    </a>

</div>

</body>

</html>
